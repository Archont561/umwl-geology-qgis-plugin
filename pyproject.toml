[general]
name=UMWL Geology
description=Plugin for QGIS
version=0.1
qgisMinimumVersion=3.40
author=Eryk Srebrny
email=esrebrny@onet.eu
repository="https://github.com/Archont561/umwl-geology-plugin"

[tool.mypy]
ignore_missing_imports = true
disallow_untyped_defs = true
warn_redundant_casts = true
no_implicit_optional = true
strict_optional = true
files = ["src", "tests"]
exclude = [
    "stubs",
    ".*\\.pyi$"
]